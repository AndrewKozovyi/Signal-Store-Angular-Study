@if (cartStore.isCartOpen()) {
  <div (click)="cartStore.toggleCart(false)" class="cart-overlay"></div>
  <div class="cart-dialog">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button (click)="cartStore.toggleCart(false)" class="close-btn">✕</button>
    </div>

    <div class="cart-items">
      @if (!cartStore.cartCount()) {
        <p class="empty-cart">Your cart is empty.</p>
      }

      @for (ticket of cartStore.cartTickets(); track ticket.id) {
        <div class="cart-item">
          <div class="item-info">
            <h4>{{ ticket.title }}</h4>
            <p>${{ ticket.price }}</p>
          </div>
          <div class="item-actions">
            <button>-</button>
            <span>{{ ticket.quantity }}</span>
            <button>+</button>
            <button class="delete-btn">🗑️</button>
          </div>
        </div>
      }
    </div>

    @if (cartStore.cartCount()) {
      <div class="cart-footer">
        <h3>Total: $0</h3>
        <button class="btn primary-btn full-width">Checkout</button>
      </div>
    }
  </div>
}
